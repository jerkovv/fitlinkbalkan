<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0B0A10; }
  body { font-family: Poppins, sans-serif; color: #F6F3FB; position: relative; }
  .sjaj { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(70vw 55vw at 18% 6%, rgba(139,61,235,.55), transparent 70%),
      radial-gradient(60vw 50vw at 92% 18%, rgba(226,76,166,.38), transparent 70%),
      radial-gradient(90vw 70vw at 50% 78%, rgba(91,75,239,.35), transparent 70%); }
  .tekst { position: absolute; left: 7.5vw; right: 7.5vw; top: 9.2vw; z-index: 2; }
  .nad { display: inline-flex; align-items: center; gap: 1.6vw; font-weight: 600; font-size: 3.1vw;
    letter-spacing: .38em; text-transform: uppercase; color: #C4A2FF;
    padding: 1.5vw 3vw; border-radius: 99vw; background: rgba(196,162,255,.12);
    border: 1px solid rgba(196,162,255,.25); }
  .nad i { width: 1.8vw; height: 1.8vw; border-radius: 50%; background: linear-gradient(135deg,#8B3DEB,#E24CA6); display: block; }
  h1 { margin-top: 4.2vw; font-weight: 800; font-size: 10.6vw; line-height: 1.04; letter-spacing: -.035em; }
  h1 em { font-style: normal; background: linear-gradient(90deg,#B57BFF,#8C7DFF 45%,#FF7CC6);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 3.2vw; font-weight: 500; font-size: 4.3vw; line-height: 1.38; color: #B9B2C9; max-width: 82vw; }
  .ekran { position: absolute; left: 50%; transform: translateX(-50%); width: 82vw; z-index: 1;
    border-radius: 7.6vw; overflow: hidden; background: #000;
    box-shadow: 0 0 0 .35vw rgba(255,255,255,.10), 0 4vw 12vw rgba(139,61,235,.45), 0 1vw 4vw rgba(0,0,0,.6); }
  .ekran img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="sjaj"></div>
<div class="tekst">
  <div class="nad"><i></i><span id="nad"></span></div>
  <h1 id="naslov"></h1>
  <p id="opis"></p>
</div>
<div class="ekran" id="ekran"><img id="slika" alt=""></div>
<script>
const SLAJDOVI = {
  1:  { nad: "Za trenere", naslov: "Svaki klijent,<br><em>uživo.</em>", opis: "Puls, kalorije i serija dok trenira, sa sata ili narukvice za puls.", slika: "t-uzivo-detalj" },
  2:  { nad: "Za vežbače", naslov: "Trening koji te<br><em>vodi.</em>", opis: "Serije, kilaže, puls i kalorije na jednom ekranu.", slika: "a-trening" },
  3:  { nad: "Puls i kalorije", naslov: "Kalorije sa sata<br>ili <em>narukvice.</em>", opis: "Apple Watch, narukvica za puls ili telefon. Zone pulsa tokom celog treninga.", slika: "a-slobodan" },
  4:  { nad: "Za trenere", naslov: "Termini bez<br><em>poruka.</em>", opis: "Klijenti rezervišu sami, a ti vidiš ko dolazi i ko čeka.", slika: "t-kalendar" },
  5:  { nad: "Za trenere", naslov: "Program za<br><em>par minuta.</em>", opis: "Dani, vežbe i serije, pa jednim dodirom klijentu.", slika: "t-urednik" },
  6:  { nad: "Za vežbače", naslov: "Pauza se<br><em>meri sama.</em>", opis: "Odbrojavanje, sledeća serija i puls koji se smiruje.", slika: "a-odmor" },
  7:  { nad: "Za trenere", naslov: "Uplate pod<br><em>kontrolom.</em>", opis: "Članarine, zarada i ko još nije platio.", slika: "t-finansije" },
  8:  { nad: "Za vežbače", naslov: "Ishrana od<br><em>tvog trenera.</em>", opis: "Kalorije i makroi za danas, obrok po obrok.", slika: "a-ishrana" },
  9:  { nad: "Za vežbače", naslov: "Napredak koji<br><em>se vidi.</em>", opis: "Treninzi, nizovi i lični rekordi na jednom mestu.", slika: "a-napredak" },
  10: { nad: "Za vežbače", naslov: "Rezervacija<br><em>bez poziva.</em>", opis: "Slobodni termini, lista čekanja i otkazivanje u roku.", slika: "a-rezervisi" },
};
const i = parseInt(location.hash.slice(1) || "1", 10);
const s = SLAJDOVI[i];
document.getElementById("nad").textContent = s.nad;
document.getElementById("naslov").innerHTML = s.naslov;
document.getElementById("opis").textContent = s.opis;
document.getElementById("slika").src = "sirovi/" + s.slika + ".png";
// Ekran pocinje ispod teksta; donji deo izlazi van slike.
requestAnimationFrame(() => {
  const t = document.querySelector(".tekst").getBoundingClientRect();
  document.getElementById("ekran").style.top = (t.bottom + window.innerWidth * 0.075) + "px";
});
</script>
</body>
</html>
