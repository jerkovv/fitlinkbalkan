<section class="sec" id="uzivo">
  <div class="sech"><h2>Početna i uživo</h2><p>Šta se dešava sada: ko trenira, u kojoj zoni, ko je na odmoru i koji trening je možda ostao upaljen.</p></div>
  <div class="shots">

    <figure class="shot">
      {{T_HOME}}
      <figcaption><b>Početna</b><code>/trener</code><br><i>Odobreno: uplate, aktivni vežbači, dugme Uživo</i></figcaption>
    </figure>

    <figure class="shot">
      <section class="phone" aria-label="Trenira uživo">
        <div class="glow" style="height:440px;background:radial-gradient(300px 260px at 50% 170px,rgba(61,220,151,.26),transparent 72%),radial-gradient(260px 220px at 100% 0,rgba(139,61,235,.45),transparent 70%)"></div>
        <div class="sb"><span>18:42</span><span class="ic"><svg class="f" viewBox="0 0 18 12" width="18"><use href="#signal"/></svg><svg class="f" viewBox="0 0 16 12" width="16"><use href="#wifi"/></svg><svg class="f" viewBox="0 0 27 12" width="27"><use href="#batt"/></svg></span></div>
        <svg class="ecg" viewBox="0 0 360 200" style="top:112px;width:360px;height:200px;-webkit-mask-image:radial-gradient(140px 64px at 50% 32%,transparent 45%,#000 100%);mask-image:radial-gradient(140px 64px at 50% 32%,transparent 45%,#000 100%)" aria-hidden="true">
          <g fill="none" stroke-width="2.2" stroke-linejoin="round" opacity=".6">
            <path d="M0 40 H40 L46 36 L52 44 L58 14 L64 60 L70 40 H130 L136 36 L142 44 L148 14 L154 60 L160 40 H220 L226 36 L232 44 L238 14 L244 60 L250 40 H310 L316 36 L322 44 L328 14 L334 60 L340 40 H360" stroke="#30D158" style="filter:drop-shadow(0 0 6px #30D158)"/>
            <path d="M0 90 H70 L76 86 L82 94 L88 60 L94 112 L100 90 H150 L156 86 L162 94 L168 60 L174 112 L180 90 H230 L236 86 L242 94 L248 60 L254 112 L260 90 H310 L316 86 L322 94 L328 60 L334 112 L340 90 H360" stroke="#FF9F0A" style="filter:drop-shadow(0 0 6px #FF9F0A)"/>
            <path d="M0 135 H90 L98 130 L106 140 L114 112 L122 152 L130 135 H250 L258 130 L266 140 L274 112 L282 152 L290 135 H360" stroke="#5AC8FA" style="filter:drop-shadow(0 0 6px #5AC8FA)"/>
            <path d="M0 175 H20 L26 172 L32 178 L38 158 L44 190 L50 175 H160 L166 172 L172 178 L178 158 L184 190 L190 175 H300 L306 172 L312 178 L318 158 L324 190 L330 175 H360" stroke="#0A84FF" style="filter:drop-shadow(0 0 6px #0A84FF)"/>
          </g>
        </svg>
        <div class="scr" style="gap:12px">
          <div style="display:flex;align-items:center;gap:12px"><span class="xb gls"><svg class="i"><use href="#back"/></svg></span><span class="ey" style="flex:1">Trenira uživo</span><span class="pl2 ok" style="height:28px;padding:0 11px"><i class="livedot"></i>uživo</span></div>
          <div style="margin-top:26px;text-align:center"><span class="bign glowtxt" style="font-size:66px;color:#fff">4</span><div style="margin-top:6px;font-size:15px;color:var(--tx2)">vežbača trenira upravo sada</div></div>
          <div style="display:flex;justify-content:center;gap:6px">
            <span class="pl2 gls" style="height:28px;padding:0 11px;color:var(--ok)"><i class="rd" style="background:var(--ok)"></i>3 vežba</span>
            <span class="pl2 gls" style="height:28px;padding:0 11px;color:#8EDBFF"><i class="rd" style="background:#5AC8FA"></i>1 odmor</span>
            <span class="pl2 gls" style="height:28px;padding:0 11px;color:var(--bad)"><i class="rd" style="background:var(--bad)"></i>1 upaljen 2h</span>
          </div>
          <div class="lrail" style="margin-top:8px">
            <div class="lcard" style="color:#30D158">
              <div style="display:flex;align-items:center;gap:8px;color:var(--tx)"><span class="ini2">LP<i></i></span><div class="tx"><b style="font-size:13.5px">Luka Petrović</b><small>42min · 386 kcal</small></div></div>
              <div style="display:flex;align-items:baseline;gap:6px;margin-top:16px"><span class="fig glowtxt" style="font-size:38px;line-height:1">132</span><small style="font-size:12px;color:var(--tx2)">bpm</small></div>
              <div class="zb5" style="margin-top:12px"><i></i><i class="on"></i><i></i><i></i><i></i></div>
              <div style="margin-top:12px;font-size:12px;color:var(--tx)">Veslanje u pretklonu</div>
              <div style="font-size:11px;color:var(--tx2)">Serija 3 · traka 82%</div>
            </div>
            <div class="lcard" style="color:#FF9F0A">
              <div style="display:flex;align-items:center;gap:8px;color:var(--tx)"><span class="ini2">AM<i></i></span><div class="tx"><b style="font-size:13.5px">Ana Marković</b><small>1h 05min · 512 kcal</small></div></div>
              <div style="display:flex;align-items:baseline;gap:6px;margin-top:16px"><span class="fig glowtxt" style="font-size:38px;line-height:1">151</span><small style="font-size:12px;color:var(--tx2)">bpm</small></div>
              <div class="zb5" style="margin-top:12px"><i></i><i></i><i></i><i class="on"></i><i></i></div>
              <div style="margin-top:12px;font-size:12px;color:var(--tx)">Rumunsko mrtvo dizanje</div>
              <div style="font-size:11px;color:var(--warn)">Serija 2 · senzor 18%</div>
            </div>
            <div class="lcard" style="color:#5AC8FA">
              <div style="display:flex;align-items:center;gap:8px;color:var(--tx)"><span class="ini2">JN<i></i></span><div class="tx"><b style="font-size:13.5px">Jovana Nikolić</b><small>24min</small></div></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:20px;background:linear-gradient(90deg,rgba(255,69,58,.2),var(--s1) 70%);border:1px solid rgba(255,107,97,.45)">
            <span class="ini2">NS<i style="background:var(--bad)"></i></span><div class="tx"><b style="font-size:13.5px">Nikola Savić · 2h 14min</b><small style="color:var(--bad)">Trening možda nije ugašen</small></div>
            <span class="pl2" style="height:32px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,107,97,.6);color:var(--bad);font-size:12px"><svg class="f" viewBox="0 0 24 24" style="width:10px;height:10px"><use href="#stop"/></svg>Zaustavi</span>
          </div>
        </div>
      </section>
      <figcaption><b>Trenira uživo</b><code>/trener/uzivo</code><br><i>Novo: veliki broj preko EKG linija u bojama zona, vežbači kao velike kartice</i></figcaption>
    </figure>

    <figure class="shot">
      {{T_LIVE}}
      <figcaption><b>Jedan vežbač uživo</b><code>/trener/vezbac/:athleteId/live</code><br><i>Odobreno: merač pulsa, serije, brze poruke</i></figcaption>
    </figure>

  </div>
</section>
