<section class="sec" id="novac">

          <div class="req" style="padding:14px">
            <div style="display:flex;align-items:center;gap:12px"><span class="ini2" style="width:50px;height:50px;font-size:14px">LP</span><div class="tx"><b style="font-size:15px">Luka Petrović</b><small>Personalni 10 · 10 treninga · 45 dana</small></div><div style="text-align:right"><span class="fig" style="font-size:22px">22.000</span><span class="pl2 wa" style="display:flex;justify-content:center;margin-top:4px">Keš</span></div></div>
