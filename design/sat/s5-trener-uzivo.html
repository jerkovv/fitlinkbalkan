<section class="sec" id="trener-uzivo">
  <div class="sech"><h2>Trener na satu: uživo <em style="font-style:normal;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(226,76,166,.16);color:#FFA7DA;vertical-align:middle">ideja</em></h2><p>Ovo ne postoji u aplikaciji. Ideja je da trener na zglobu vidi ko trenira, uskoči sa porukom i reaguje kad puls ode previsoko, bez vađenja telefona.</p></div>

    <figure class="shot">
      <section class="watch" aria-label="Trener, pregled uživo">

          <div class="wb" style="gap:8px">
            <div style="display:flex;align-items:baseline;gap:7px"><span class="wbig gt" style="font-size:40px">4</span><span style="font-size:11.5px;color:var(--tx2);line-height:1.2">vežbača<br>trenira</span><span class="wchip" style="margin-left:auto;height:22px;padding:0 8px;font-size:9.5px"><i class="rd" style="width:5px;height:5px;background:var(--ok);box-shadow:0 0 7px var(--ok)"></i>uživo</span></div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <div class="wrow" style="padding:7px 9px"><span class="wbadge" style="width:26px;height:26px;font-size:9.5px;font-weight:700">LP</span><div class="tx"><b>Luka Petrović</b><small>serija 3/4</small></div><div style="text-align:right"><b class="wbig" style="font-size:16px;color:var(--z2)">132</b></div></div>
              <div class="wrow" style="padding:7px 9px"><span class="wbadge" style="width:26px;height:26px;font-size:9.5px;font-weight:700">AM</span><div class="tx"><b>Ana Marković</b><small>mrtvo dizanje</small></div><div style="text-align:right"><b class="wbig" style="font-size:16px;color:var(--z4)">158</b></div></div>
              <div class="wrow" style="padding:7px 9px"><span class="wbadge" style="width:26px;height:26px;font-size:9.5px;font-weight:700">JN</span><div class="tx"><b>Jovana Nikolić</b><small>odmor</small></div><div style="text-align:right"><b class="wbig" style="font-size:16px;color:var(--z1)">104</b></div></div>
            </div>
          </div>
        </div>
      </section>
      <figcaption><b>Pregled uživo</b><code>ideja · ne postoji</code><br><i>Ko trenira sada, puls svakog u boji zone</i></figcaption>
    </figure>

    <figure class="shot">
      <section class="watch" aria-label="Trener, jedan vežbač">
        <i class="crown"></i><i class="sbtn"></i>
        <div class="wscr">
          <div class="wglow" style="background:radial-gradient(160px 160px at 50% 35%,rgba(61,220,151,.3),transparent 70%),radial-gradient(150px 140px at 0 100%,rgba(139,61,235,.34),transparent 70%)"></div>
          <span class="wtime">18:43</span>
          <div class="wb" style="gap:8px">
            <div style="display:flex;align-items:center;gap:7px"><span class="wbadge" style="width:24px;height:24px;font-size:9px;font-weight:700">LP</span><b style="font-size:12.5px;font-weight:600">Luka Petrović</b></div>
            <div class="wring" style="width:104px;height:104px">

            <div class="wrow" style="padding:7px 9px"><span class="wbadge" style="width:26px;height:26px"><svg class="i" style="width:12px;height:12px"><use href="#dumbbell"/></svg></span><div class="tx"><b>Veslanje u pretklonu</b><small>serija 3/4 · 62,5 kg</small></div></div>

          <span class="wtime">18:44</span>
          <div class="wb" style="gap:8px">
            <div><span class="wchip on">Brza poruka</span><div style="margin-top:7px;font-size:11px;color:var(--tx3)">Luki Petroviću</div></div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <div class="wrow" style="padding:8px 9px"><span class="wbadge ok" style="width:26px;height:26px"><svg class="i" style="width:12px;height:12px"><use href="#thumb"/></svg></span><div class="tx"><b>Bravo, samo tako!</b></div></div>
              <div class="wrow" style="padding:8px 9px"><span class="wbadge warn" style="width:26px;height:26px"><svg class="i" style="width:12px;height:12px"><use href="#wind"/></svg></span><div class="tx"><b>Smanji tempo</b></div></div>

            </div>
            <div class="wcap" style="margin-top:auto;text-align:center">Stiže na sat vežbača</div>
          </div>
        </div>
      </section>
      <figcaption><b>Brza poruka</b><code>ideja · ne postoji</code><br><i>Iste poruke koje trener već šalje sa telefona tokom treninga</i></figcaption>
    </figure>

    <figure class="shot">
      <section class="watch" aria-label="Trener, upozorenje na puls">
        <i class="crown"></i><i class="sbtn"></i>
        <div class="wscr">
          <div class="wglow" style="background:radial-gradient(170px 160px at 50% 32%,rgba(255,69,58,.4),transparent 70%),radial-gradient(140px 130px at 0 100%,rgba(139,61,235,.26),transparent 70%)"></div>
          <span class="wtime">18:46</span>
          <div class="wb" style="gap:0;align-items:center">
            <span class="wbadge bad" style="width:52px;height:52px;margin-top:4px"><svg class="i" style="width:24px;height:24px"><use href="#heart"/></svg></span>
            <div style="margin-top:11px;font-size:14px;font-weight:600">Ana u Zoni 5</div>
            <div class="wcard" style="width:100%;margin-top:10px;display:flex;align-items:center;gap:9px;padding:9px 11px">
              <div class="tx" style="flex:1"><b class="wbig" style="font-size:20px;color:var(--z5)">174</b><small style="display:block;margin-top:2px;font-size:9.5px;color:var(--tx3)">bpm · 2 min</small></div>
              <div class="zs" style="flex:1"><i style="background:var(--z1)"></i><i style="background:var(--z2)"></i><i style="background:var(--z3)"></i><i style="background:var(--z4)"></i><i class="on" style="background:var(--z5);box-shadow:0 5px 12px -4px rgba(255,69,58,.95)"></i></div>
            </div>
            <div style="display:flex;gap:7px;width:100%;margin-top:auto">
              <div class="wbtn s" style="flex:1"><span class="b"><svg class="i"><use href="#msgsq"/></svg></span><span>Poruka</span></div>
              <div class="wbtn s" style="flex:1"><span class="b"><svg class="i" style="stroke-width:2.6"><use href="#check"/></svg></span><span>U redu</span></div>
            </div>
          </div>
        </div>
      </section>
      <figcaption><b>Upozorenje na puls</b><code>ideja · ne postoji</code><br><i>Kucne po zglobu kad vežbač predugo ostane u najvišoj zoni</i></figcaption>
    </figure>

  </div>
</section>
